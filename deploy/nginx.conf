# Sweet Eye Coffee — nginx site for app.sweeteyecoffee.com on the Hostinger VPS.
# Its own file, so the other sites on this server are not touched (see deploy/DEPLOY.md):
#   cp deploy/nginx.conf /etc/nginx/sites-available/sweeteye
#   ln -s /etc/nginx/sites-available/sweeteye /etc/nginx/sites-enabled/sweeteye
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.sweeteyecoffee.com
# Certbot adds the HTTPS (443) block and the http -> https redirect to this file only.

# Per-IP request limits in front of the API (the API has its own stricter
# limits on sign-in, password reset, coupons and checkout — see server/src/lib/limits.js).
limit_req_zone $binary_remote_addr zone=sweeteye_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=sweeteye_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name app.sweeteyecoffee.com;

    server_tokens off;
    client_max_body_size 10m;            # staff photo uploads
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn sweeteye_conn 50;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Never serve dotfiles (.env, .git, …) even if something ends up in a public folder.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Everything goes to the Node app: the API, menu photos and the web app.
    location / {
        limit_req zone=sweeteye_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4600;   # PORT in server/.env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
